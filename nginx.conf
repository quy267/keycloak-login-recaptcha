events {
    worker_connections 1024;
}

http {
    upstream keycloak {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy all requests to Keycloak
        location / {
            proxy_pass http://keycloak;
            proxy_set_header Host $host:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:8080;
            proxy_set_header X-Forwarded-Port 8080;
            
            # Remove the restrictive CSP header from Keycloak response
            proxy_hide_header Content-Security-Policy;
            
            # Add our custom CSP header that allows reCAPTCHA and form submissions
            add_header Content-Security-Policy "frame-src 'self' https://www.google.com https://www.recaptcha.net https://www.gstatic.com; frame-ancestors 'self'; form-action 'self' http://localhost:8080; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net;" always;
        }
    }
}
