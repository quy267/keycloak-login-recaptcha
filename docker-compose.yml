version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Development mode
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      
      # reCAPTCHA keys (replace with your actual keys)
      RECAPTCHA_SITE_KEY: "6LcN830rAAAAAOsEP0IOfmJkLVU_gFm79jNMRyDm"  # Google test key
      RECAPTCHA_SECRET_KEY: "6LcN830rAAAAANsne670VauSdaK2JLigejlkSBmX" # Google test key

      # Logging
      KC_LOG_LEVEL: INFO
      
    command:
      - start-dev
      - --import-realm
    volumes:
      # Mount custom theme
      - ./themes/my-custom-theme:/opt/keycloak/themes/my-custom-theme
      # Mount realm configuration
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
      # Persist Keycloak data
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: keycloak-mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data: