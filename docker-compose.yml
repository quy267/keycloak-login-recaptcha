version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: keycloak-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
    networks:
      - keycloak-network

  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Development mode
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
      KC_HOSTNAME_URL: "http://localhost:8080"
      
      # Configure frame-src specifically for reCAPTCHA
      KC_SPI_SECURITY_HEADERS_FRAME_SRC: "'self' https://www.google.com https://www.recaptcha.net https://www.gstatic.com"
      
      # Logging
      KC_LOG_LEVEL: INFO
      
    entrypoint: ["/opt/keycloak/bin/keycloak-startup.sh"]
    command:
      - start-dev
      - --import-realm
      - --config-file=/opt/keycloak/config/keycloak.conf
    volumes:
      # Mount configuration file
      - ./config/keycloak.conf:/opt/keycloak/config/keycloak.conf:ro
      # Mount custom theme
      - ./themes/my-custom-theme:/opt/keycloak/themes/my-custom-theme
      # Mount realm configuration
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
      # Mount reCAPTCHA keys from vault
      - ./vault/secret/recaptcha-site-key:/opt/keycloak/secrets/recaptcha-site-key:ro
      - ./vault/secret/recaptcha-secret-key:/opt/keycloak/secrets/recaptcha-secret-key:ro
      # Mount startup script that reads from vault files
      - ./scripts/keycloak-startup.sh:/opt/keycloak/bin/keycloak-startup.sh:ro
      # Persist Keycloak data
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: keycloak-mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data: